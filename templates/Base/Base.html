{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}isukulu{% endblock %}</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy:      '#173347',  /* brand panel background */
            navyLight: '#20465F',  /* decorative circles on navy */
            amber:     '#E8792A',  /* single accent — links, icons, primary CTA text */
            amberDark: '#D06B21',
            ink:       '#1B2A38',  /* headings on white */
            leaf:      '#3F7859',  /* success messages */
            rust:      '#B23A2E',  /* error messages */
          },
          fontFamily: {
            sans: ['"IBM Plex Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          },
        },
      },
    }
  </script>

  <style type="text/tailwindcss">
    @layer base {
      body { @apply bg-white text-ink font-sans antialiased; }

      form p { @apply mb-4; }
      form label { @apply block text-sm font-medium text-gray-700 mb-1.5; }
      input[type="text"], input[type="email"], input[type="password"],
      input[type="number"], input[type="tel"], input[type="date"], select {
        @apply w-full rounded-lg border border-gray-300 bg-white px-3 py-2.5 text-ink
               placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-amber/40
               focus:border-amber transition-colors;
      }
      textarea {
        @apply w-full rounded-lg border border-gray-300 px-3 py-2.5 text-ink
               focus:outline-none focus:ring-2 focus:ring-amber/40 focus:border-amber transition-colors;
      }
    }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  {% block content %}{% endblock %}
</body>
</html>
