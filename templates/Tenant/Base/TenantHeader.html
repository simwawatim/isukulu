<header class="h-16 shrink-0 bg-white border-b border-gray-200 flex items-center justify-between px-8">
  <h1 class="text-lg font-semibold text-ink">{{ page_title|default:"Dashboard" }}</h1>
  <div class="flex items-center gap-4 text-sm">
    <span class="text-gray-500 hidden sm:inline">{{ request.user.email }}</span>
    <a href="{% url 'logout' %}"
       class="border border-gray-300 hover:border-navy hover:text-navy px-3 py-1.5 rounded-lg transition-colors text-gray-600">
      Log out
    </a>
  </div>
</header>
